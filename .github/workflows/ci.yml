name: CI

# Runs automatically every time code is pushed, or a pull request is opened
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: get the code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: run the tests, with secrets injected as environment variables
      # (these are configured in GitHub repo Settings -> Secrets and variables -> Actions)
      - name: Debug - check if DATABASE_URL is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is EMPTY or NOT SET"
          else
            echo "DATABASE_URL is set, length: ${#DATABASE_URL} characters"
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH_B64: ${{ secrets.ADMIN_PASSWORD_HASH_B64 }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: pytest -v




