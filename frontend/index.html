<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenaeum — Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b0f1a;
        --bg-glow: #12182b;
        --surface: #131a2b;
        --surface-raised: #1a2338;
        --border: #262f47;
        --text: #eceef2;
        --text-muted: #8891a8;
        --amber: #d7a557;
        --amber-dim: #8a6d3f;
        --ok: #6fbf9a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }
    h1, h2, .serif { font-family: 'Source Serif 4', serif; }

    /* ---------- Login screen ---------- */
    .login-overlay {
        position: fixed; inset: 0;
        background:
            radial-gradient(600px circle at 50% 35%, rgba(215,165,87,0.08), transparent 60%),
            var(--bg);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
    }
    .login-card {
        width: 100%; max-width: 380px;
        padding: 44px 40px;
        text-align: center;
    }
    .mark {
        width: 40px; height: 40px;
        margin: 0 auto 24px;
        position: relative;
    }
    .mark::before, .mark::after {
        content: "";
        position: absolute; left: 50%; top: 50%;
        border: 1px solid var(--amber);
        transform: translate(-50%,-50%) rotate(45deg);
    }
    .mark::before { width: 40px; height: 40px; }
    .mark::after { width: 18px; height: 18px; }
    .login-card h1 {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.2px;
        margin-bottom: 8px;
    }
    .login-card p.tagline {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 34px;
    }
    .field { text-align: left; margin-bottom: 16px; }
    .field label {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 7px;
    }
    .field input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 14px;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        transition: border-color 0.15s;
    }
    .field input:focus {
        outline: none;
        border-color: var(--amber-dim);
    }
    .btn-primary {
        width: 100%;
        margin-top: 6px;
        padding: 13px;
        background: var(--amber);
        color: #1a1305;
        border: none;
        border-radius: 6px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .btn-primary:hover { background: #e5b568; }
    .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    .login-error {
        margin-top: 16px;
        font-size: 13px;
        color: #e29a9a;
        display: none;
    }

    /* ---------- Main app ---------- */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 22px 36px;
        border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .mark { width: 22px; height: 22px; margin: 0; }
    .brand .mark::before { width: 22px; height: 22px; }
    .brand .mark::after { width: 10px; height: 10px; }
    .brand-text h1 { font-size: 19px; font-weight: 500; line-height: 1.1; }
    .brand-text p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--amber-dim); color: var(--text); }

    .layout {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 24px 60px;
    }

    .status-line {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
    }
    .status-line .dot {
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        margin-right: 8px;
        background: var(--text-muted);
    }
    .status-line .dot.ready { background: var(--ok); }
    .status-line .dot.error { background: #e29a9a; }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 22px 24px;
        margin-bottom: 20px;
    }
    .panel h2 {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: none;
        margin-bottom: 14px;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.2px;
    }
    .upload-row { display: flex; gap: 10px; }
    input[type="file"] {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 12px;
        color: var(--text-muted);
        font-size: 13px;
    }
    .btn-secondary {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 9px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: border-color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--amber-dim); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-msg {
        margin-top: 12px;
        font-size: 12px;
        display: none;
    }
    .upload-msg.success { display: block; color: var(--ok); }
    .upload-msg.error { display: block; color: #e29a9a; }

    .chat-log {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-height: 420px;
        overflow-y: auto;
        margin-bottom: 20px;
        padding-right: 4px;
    }
    .entry .who {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
        letter-spacing: 0.3px;
    }
    .entry.user .who { color: var(--amber-dim); }
    .entry.ai .who { color: var(--ok); }
    .entry p {
        font-family: 'Source Serif 4', serif;
        font-size: 15.5px;
        line-height: 1.65;
        color: var(--text);
    }
    .entry .sources {
        margin-top: 8px;
        font-size: 11px;
        font-family: 'Inter', sans-serif;
        color: var(--text-muted);
    }
    .entry .thinking { font-style: italic; color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 13px; }

    .ask-row { display: flex; gap: 10px; }
    .ask-row input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 16px;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
    }
    .ask-row input:focus { outline: none; border-color: var(--amber-dim); }
</style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="mark"></div>
            <h1>Enter the Athenaeum</h1>
            <p class="tagline">Your documents, ready for questions.</p>

            <div class="field">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="" onkeypress="if(event.key==='Enter') doLogin()">
            </div>
            <button class="btn-primary" onclick="doLogin()" id="loginBtn">Sign in</button>
            <div class="login-error" id="loginError">Incorrect username or password.</div>
        </div>
    </div>

    <div class="topbar">
        <div class="brand">
            <div class="mark"></div>
            <div class="brand-text">
                <h1>Athenaeum</h1>
                <p>Ask your documents anything</p>
            </div>
        </div>
        <button class="btn-ghost" onclick="doLogout()">Sign out</button>
    </div>

    <div class="layout">
        <div class="status-line" id="statusBar"><span class="dot"></span>Checking status…</div>

        <div class="panel">
            <h2>Add a document</h2>
            <div class="upload-row">
                <input type="file" id="pdfFile" accept=".pdf">
                <button class="btn-secondary" onclick="uploadPDF()" id="uploadBtn">Upload</button>
            </div>
            <div class="upload-msg" id="uploadMsg"></div>
        </div>

        <div class="panel">
            <h2>Ask a question</h2>
            <div class="chat-log" id="chatBox">
                <div class="entry ai">
                    <div class="who">Assistant</div>
                    <p>Upload a document above, then ask me anything about it.</p>
                </div>
            </div>
            <div class="ask-row">
                <input type="text" id="questionInput" placeholder="What would you like to know?" onkeypress="if(event.key==='Enter') askQuestion()">
                <button class="btn-secondary" onclick="askQuestion()" id="askBtn">Ask</button>
            </div>
        </div>
    </div>

<script>
    const API = "http://127.0.0.1:8000";

    function getToken() { return localStorage.getItem("token"); }
    function showApp() { document.getElementById("loginOverlay").style.display = "none"; }
    function showLogin() { document.getElementById("loginOverlay").style.display = "flex"; }

    async function doLogin() {
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        const errorEl = document.getElementById("loginError");
        const btn = document.getElementById("loginBtn");
        errorEl.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Signing in…";

        const body = new URLSearchParams();
        body.append("username", username);
        body.append("password", password);

        try {
            const res = await fetch(`${API}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: body
            });
            if (!res.ok) {
                errorEl.textContent = "Incorrect username or password.";
                errorEl.style.display = "block";
            } else {
                const data = await res.json();
                localStorage.setItem("token", data.access_token);
                showApp();
                checkStatus();
            }
        } catch {
            errorEl.textContent = "Can't reach the server. Make sure uvicorn is running.";
            errorEl.style.display = "block";
        }
        btn.disabled = false;
        btn.textContent = "Sign in";
    }

    function doLogout() {
        localStorage.removeItem("token");
        showLogin();
    }

    async function checkStatus() {
        const bar = document.getElementById("statusBar");
        try {
            const res = await fetch(`${API}/status`);
            const data = await res.json();
            if (data.knowledge_base_ready) {
                bar.innerHTML = `<span class="dot ready"></span>Ready — ${data.pdf_count} document${data.pdf_count === 1 ? '' : 's'} in the archive`;
            } else {
                bar.innerHTML = `<span class="dot"></span>No documents yet — upload one to get started`;
            }
        } catch {
            bar.innerHTML = `<span class="dot error"></span>Can't reach the server`;
        }
    }

    async function uploadPDF() {
        const fileInput = document.getElementById("pdfFile");
        const msg = document.getElementById("uploadMsg");
        const btn = document.getElementById("uploadBtn");

        if (!fileInput.files[0]) {
            msg.className = "upload-msg error";
            msg.textContent = "Choose a PDF first.";
            return;
        }

        btn.disabled = true;
        btn.textContent = "Uploading…";
        msg.className = "upload-msg";
        msg.textContent = "";

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const res = await fetch(`${API}/upload`, { method: "POST", body: formData });
            const data = await res.json();
            if (data.error) {
                msg.className = "upload-msg error";
                msg.textContent = data.error;
            } else {
                msg.className = "upload-msg success";
                msg.textContent = data.message;
                checkStatus();
            }
        } catch {
            msg.className = "upload-msg error";
            msg.textContent = "Upload failed. Make sure the backend is running.";
        }
        btn.disabled = false;
        btn.textContent = "Upload";
    }

    async function askQuestion() {
        const input = document.getElementById("questionInput");
        const chatBox = document.getElementById("chatBox");
        const btn = document.getElementById("askBtn");
        const question = input.value.trim();
        if (!question) return;

        chatBox.innerHTML += `
            <div class="entry user">
                <div class="who">You</div>
                <p>${question}</p>
            </div>`;
        input.value = "";
        btn.disabled = true;
        btn.textContent = "Thinking…";

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `
            <div class="entry ai" id="${loadingId}">
                <div class="who">Assistant</div>
                <p class="thinking">Searching your documents…</p>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch(`${API}/ask`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + getToken()
                },
                body: JSON.stringify({ question })
            });

            if (res.status === 401) {
                document.getElementById(loadingId).innerHTML =
                    `<div class="who">Assistant</div><p>Your session expired — please sign in again.</p>`;
                doLogout();
                btn.disabled = false;
                btn.textContent = "Ask";
                return;
            }

            const data = await res.json();
            const el = document.getElementById(loadingId);
            if (data.error) {
                el.innerHTML = `<div class="who">Assistant</div><p>${data.error}</p>`;
            } else {
                const sourceLabel = data.source === "general_knowledge"
                    ? "Answered from general AI knowledge (not found in your documents)"
                    : `${data.sources_found} source section${data.sources_found === 1 ? '' : 's'} referenced from your documents`;
                el.innerHTML = `
                    <div class="who">Assistant</div>
                    <p>${data.answer}</p>
                    <div class="sources">${sourceLabel}</div>`;
            }
        } catch {
            document.getElementById(loadingId).innerHTML =
                `<div class="who">Assistant</div><p>Couldn't reach the server. Make sure uvicorn is running.</p>`;
        }
        btn.disabled = false;
        btn.textContent = "Ask";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    if (getToken()) { showApp(); } else { showLogin(); }
    checkStatus();
    setInterval(checkStatus, 10000);
</script>
</body>
</html>
